name: EBT — synthetic model numerical verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  numerical-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07_source_baseline/EBT_R01_Feasibility_v0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Run numerical verification
        run: python -m pytest -q
      - name: Reproduce synthetic benchmark
        run: python scripts/run_study.py
      - name: Verify numerical reproduction within documented tolerances
        run: python scripts/verify_reproduction.py

  pilot-planning-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pilot matrix design (no powered testing)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rebuild pilot planning matrix
        run: python scripts/make_pilot_plan.py --out /tmp/ebt_q0_pilot_plan.csv

  model-boundary-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 09_model_comparison
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install -r ../07_source_baseline/EBT_R01_Feasibility_v0.1/requirements.txt
      - name: Verify physics, uncertainty and boundary failure tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Generate synthetic comparison
        run: python -m research_models.run --out results/synthetic_model_comparison_v0.4.json
      - name: Test robustness to synthetic noise
        run: python -m scripts.robustness_scan
      - name: Regenerate synthetic figures
        run: python -m scripts.plot_comparison

  fixture-preliminary-design-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify v0.5 source traceability, topology and BOM arithmetic
        run: python -m unittest discover -s 10_fixture_v0.5/tests -p 'test_*.py' -v

  q0-acquisition-integrity-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 13_q0_data_integrity_v0.8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check synthetic data integrity and adversarial failures
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Generate synthetic-only data contract example
        run: python demo.py
