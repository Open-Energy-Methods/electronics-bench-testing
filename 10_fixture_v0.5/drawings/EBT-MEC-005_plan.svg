/><text fill="#237460" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="bold" x="718" y="130">SOURCE VERIFIED</text><text fill="#202f3e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" x="718" y="151">SK 92 100 SA external envelope: 100 × 100 × 40 mm.</text><text fill="#237460" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="bold" x="718" y="185">SOURCE VERIFIED</text><text fill="#202f3e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" x="718" y="206">Bourns heater body: 10.1 × 14.6 mm; hole Ø3.6.</text><text fill="#b66c15" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="bold" x="718" y="240">DESIGN ASSUMPTION</text><text fill="#202f3e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" x="718" y="261">Aluminium adapter plate: 100 × 100 × 4 mm.</text><text fill="#b66c15" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="bold" x="718" y="295">DESIGN ASSUMPTION</text><text fill="#202f3e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" x="718" y="316">Two nominal sites: x = −25 and +25 mm, y = 0.</text><text fill="#b66c15" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="bold" x="718" y="350">DESIGN ASSUMPTION</text><text fill="#202f3e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" x="718" y="371">Package hole centre y = +4.8 mm in drawn orientation.</text><text fill="#bf3d38" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="bold" x="718" y="405">MISSING CRITICAL</text><text fill="#202f3e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" x="718" y="426">Real extrusion flat base, fins, tap depth &amp; clearance.</text><text fill="#bf3d38" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="bold" x="718" y="460">MISSING CRITICAL</text><text fill="#202f3e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" x="718" y="481">Fastener, torque, interface material and insulation.</text><text fill="#bf3d38" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="bold" x="718" y="515">MISSING CRITICAL</text><text fill="#202f3e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" x="718" y="536">Mounting-pad tolerances and sensor attachment geometry.</text><text fill="#bf3d38" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="bold" x="718" y="570">SCIENTIFIC WARNING</text><text fill="#202f3e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" x="718" y="591">Both sites are NOT automatically thermally equivalent.</text><text fill="#bf3d38" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="bold" x="718" y="625">SCIENTIFIC WARNING</text><text fill="#202f3e" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" x="718" y="646">K-PLATE is not measured sink temperature by definition.</text><text fill="#bf3d38" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="bold" x="28" y="813">Use editable DXF for geometry review only — all drill/tap operations blocked pending manufacturer section and host approval.</text></svg>