[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ebt-research-feasibility"
version = "0.1.0"
description = "Reproducible synthetic electrothermal research feasibility benchmark"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.12", "pandas>=2.0", "matplotlib>=3.8"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
